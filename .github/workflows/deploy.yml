# 将 dist 推送到 gh-pages 分支。在 Settings → Pages 选「从分支部署」、分支 gh-pages、目录 / 即可。
# 不依赖 “GitHub Actions” 作为 Pages 构建源，避免未启用时 deploy-pages 返回 404。

name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Push dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 仅保留单分支历史，减小 .git 体积
          force_orphan: true
